name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          version: "0.11.18"
      - run: uv sync --locked --python 3.12
      - run: uv run ruff check . --exclude migrations/legacy_2024
      - run: uv run pytest -q
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run vendor
      - run: git diff --exit-code -- static/vendor

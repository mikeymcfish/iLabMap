[project]
name = "ilab-map"
version = "2.0.0"
description = "Local-first lab inventory, floor plans, and 3D item locations"
requires-python = ">=3.12"
dependencies = [
  "flask>=3.1,<4", "flask-sqlalchemy>=3.1,<4", "flask-migrate>=4,<5",
  "python-dotenv>=1.1,<2", "pillow>=11.3,<13", "waitress>=3,<4",
  "openai>=2,<3",
]
[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
[tool.ruff]
target-version = "py312"
line-length = 110
exclude = ["recovery", ".runtime", "venv", "static/vendor"]
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iLab Map</title>
    <link rel="stylesheet" href="/static/css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <div class="container-fluid py-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 class="text-center mb-0 flex-grow-1">iLab Map (3D.v.1)</h1>
            <div class="flex-shrink-0" style="min-width: 200px;">
                <select id="mapSelector" class="form-select">
                    <option value="">Select a map</option>
                </select>
            </div>
        </div>
        <div class="row">
            <div class="col-md-4 d-flex flex-column">
                <div class="mb-3">
                    <div class="input-group">
                        <select id="searchType" class="form-select" style="max-width: 120px;">
                            <option value="all">All</option>
                            <option value="name">Name</option>
                            <option value="tags">Tags</option>
                        </select>
                        <input type="text" id="searchInput" class="form-control" placeholder="Search items...">
                    </div>
                </div>
                <div class="mb-3">
                    <button id="addItemBtn" class="btn btn-outline-primary me-2" disabled>
                        <i class="fas fa-plus"></i> Add
                    </button>
                    <button id="clearBtn" class="btn btn-outline-secondary">
                        <i class="fas fa-broom"></i> Clear
                    </button>

                    <button id="openChatBtn" class="btn btn-outline-info ms-2">
                        <i class="fas fa-comments"></i> Chat
                    </button>
                </div>
                <div id="itemList" class="list-group mt-3 flex-grow-1 overflow-auto">
                    <!-- Items will be dynamically added here -->
                </div>
            </div>
            <div class="col-md-8">
                <canvas id="mapCanvas" style="display:none;" class="img-fluid"></canvas>
                <!-- 3D Model Container Section -->
                <div id="model-container"></div>
                <!-- Three.js core -->
                <script type="importmap">
                  {
                    "imports": {
                      "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
                      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
                    }
                  }
                </script>
                <script type="module">

                    import * as THREE from 'three';

                    import Stats from 'three/addons/libs/stats.module.js';
                    import { GUI } from 'three/addons/libs/lil-gui.module.min.js';

                    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
                    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
                    let scene, camera, renderer, controls, mesh, previousMarker;
                    const modelOffset = new THREE.Vector3(0, 0, 0); // Adjust this vector to tweak the offset of the model

                    function init() {
                        // Scene setup
                        scene = new THREE.Scene();
                        const aspect = window.innerWidth / window.innerHeight;

                        const frustumSize = 3;  // Control the zoom level of the orthographic view
                        camera = new THREE.OrthographicCamera(
                            -frustumSize * aspect / 2,  // left
                            frustumSize * aspect / 2,   // right
                            frustumSize / 2,            // top
                            -frustumSize / 2,           // bottom
                            0.1,                        // near
                            1000                        // far
                        );
                        renderer = new THREE.WebGLRenderer({ alpha: true });  // Enable transparency
                        renderer.setSize(window.innerWidth, window.innerHeight);

                        // Set the clear color to transparent
                        renderer.setClearColor(0x000000, 0);  // The second argument (0) represents the alpha value (transparent)
                        renderer.shadowMap.enabled = true;  // Enable shadow mapping
                        renderer.shadowMap.type = THREE.PCFSoftShadowMap;  // Use soft shadows for smoother results

                        document.getElementById('model-container').appendChild(renderer.domElement);

                        controls = new OrbitControls(camera, renderer.domElement);

                        // Limit rotation to the Y-axis only (no restrictions for Y-axis rotation)
                        controls.minAzimuthAngle = -Infinity;  // No restriction on Y rotation
                        controls.maxAzimuthAngle = Infinity;

                        // Limit the up/down rotation (polar angle) within 20 degrees
                        controls.minPolarAngle = THREE.MathUtils.degToRad(-60);  // Minimum limit (90 degrees - 10 degrees)
                        controls.maxPolarAngle = THREE.MathUtils.degToRad(60);  // Maximum limit (90 degrees + 10 degrees)

                        // Prevent panning
                        controls.enablePan = false;

                        // Continuously update the controls
                        controls.update();

                        // Load 3D model (Example using GLTFLoader)
                        let loader = new GLTFLoader();
                        let ambientLight = new THREE.AmbientLight(0xffffff, 1);
                        scene.add(ambientLight);
                        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.1);
                        directionalLight.castShadow = true;  // Enable shadows for the light
                        directionalLight.shadow.mapSize.width = 1024;  // Shadow map resolution (higher values give better quality)
                        directionalLight.shadow.mapSize.height = 1024;
                        directionalLight.shadow.camera.near = 0.1;
                        directionalLight.shadow.camera.far = 50;
                        directionalLight.position.set(-1, 20, 0); // Initial position of the light

                        const pointLight = new THREE.PointLight(0xffffff, 1, 2000);
                        pointLight.castShadow = true;  // Enable shadows for the light
                        pointLight.shadow.mapSize.width = 1024;  // Shadow map resolution (higher values give better quality)
                        pointLight.shadow.mapSize.height = 1024;
                        pointLight.shadow.camera.near = 0.1;
                        pointLight.shadow.camera.far = 90;
                        pointLight.position.set(0, 1.5, 0); // Initial position of the light

                        loader.load('/static/model.gltf', function(gltf) {
                            gltf.scene.scale.set(0.01, 0.01, 0.01);  // Scale the model by a factor of 2
                            gltf.scene.rotation.set(THREE.MathUtils.degToRad(0), THREE.MathUtils.degToRad(50), THREE.MathUtils.degToRad(0));

                            // Compute the bounding box of the model
                            let box = new THREE.Box3().setFromObject(gltf.scene);

                            // Get the center of the bounding box
                            let center = new THREE.Vector3();
                            box.getCenter(center);

                            // Reposition the model so its center is at (x-1, y, z)
                            gltf.scene.position.set(-1 - center.x, -center.y, -center.z);

                            gltf.scene.traverse(function(node) {
                                if (node.isMesh) {
                                    mesh = node;  // Ensure we access the correct mesh
                                    node.castShadow = true;    // Make the model cast shadows
                                    node.receiveShadow = true; // Make the model receive shadows
                                    mesh.material.needsUpdate = true;
                                }
                            });

                            scene.add(gltf.scene);
                        });

                        // Reposition the camera to point at the center of the model
                        camera.position.set(0, 0, 20);  // Set camera Z to be in front of the model
                        camera.lookAt(new THREE.Vector3(0, 0, 0));  // Make the camera look at the origin

                        console.log("Model loaded and camera centered!");

                        // Click to add marker
                        window.addEventListener('click', onModelClick);

                        animate();
                    }

                    function onModelClick(event) {
                        // Check if the shift key is not pressed, then exit the function
                        if (!event.shiftKey) return;

                        // Convert click to 3D space
                        let rect = renderer.domElement.getBoundingClientRect();
                        let mouse = new THREE.Vector2(
                            ((event.clientX - rect.left) / rect.width) * 2 - 1,
                            -((event.clientY - rect.top) / rect.height) * 2 + 1
                        );
                        let raycaster = new THREE.Raycaster();
                        raycaster.setFromCamera(mouse, camera);

                        let intersects = raycaster.intersectObjects(scene.children);
                        if (intersects.length > 0) {
                            let intersect = intersects[0];

                            // Create and place marker (sphere) at click position
                            let sphereGeometry = new THREE.SphereGeometry(0.015, 8, 8);
                            let sphereMaterial = new THREE.MeshPhongMaterial({ color: 0xff0000 });
                            let marker = new THREE.Mesh(sphereGeometry, sphereMaterial);
                            marker.position.copy(intersect.point);
                            try {
                                scene.remove(previousMarker);
                            } catch (e) {}

                            scene.add(marker);
                            previousMarker = marker;

                            // Send marker position to Flask
                            fetch('/save_marker', {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({ x: intersect.point.x, y: intersect.point.y, z: intersect.point.z })
                            });
                        }
                    }

                    function animate() {
                        requestAnimationFrame(animate);
                        controls.update();
                        renderer.render(scene, camera);
                    }

                    init();
                </script>

            </div>
        </div>
    </div>

    <div class="card position-absolute" style="display: none;" id="addItemForm">
        <div class="card-body">
            <h5 class="card-title">Add New Item</h5>
            <form id="itemForm">
                <div class="mb-3">
                    <label for="itemName" class="form-label">Item Name</label>
                    <input type="text" class="form-control" id="itemName" required>
                </div>
                <div class="mb-3">
                    <label for="itemImage" class="form-label">Upload Image</label>
                    <input type="file" class="form-control" id="itemImage" accept="image/*">
                    <div id="dropArea" class="mt-2">
                        Drag and drop image here
                    </div>
                </div>
                <div class="mb-3">
                    <label for="itemTags" class="form-label">Tags (comma-separated)</label>
                    <input type="text" class="form-control" id="itemTags">
                </div>
                <input type="hidden" id="itemColor" value="red">
                <input type="hidden" id="itemZone" value="">
                <div class="mb-3">
                    <label for="itemQuantity" class="form-label">Quantity</label>
                    <input type="number" class="form-control" id="itemQuantity" value="1" min="1">
                </div>
                <div class="mb-3">
                    <label for="itemDescription" class="form-label">Description</label>
                    <textarea class="form-control" id="itemDescription" rows="3"></textarea>
                </div>
                <div class="mb-3">
                    <label for="itemLink" class="form-label">External Link</label>
                    <input type="url" class="form-control" id="itemLink" placeholder="https://example.com">
                </div>
                <div class="mb-3">
                    <label class="form-label">Safety Hazards</label>
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" value="glasses" id="glasses">
                        <label class="form-check-label" for="glasses">
                            Use safety glasses
                        </label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" value="hand" id="hand">
                        <label class="form-check-label" for="hand">
                            Use gloves
                        </label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" value="fire" id="fire">
                        <label class="form-check-label" for="fire">
                            Flammable
                        </label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" value="bolt" id="bolt">
                        <label class="form-check-label" for="bolt">
                            High voltage
                        </label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" value="mask" id="mask">
                        <label class="form-check-label" for="mask">
                            Use mask
                        </label>
                    </div>
                </div>
                <div class="d-flex justify-content-between">
                    <button type="button" class="btn btn-primary" id="updateItemBtn">Save Item</button>
                    <button type="button" class="btn btn-secondary" id="cancelAddBtn">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Item Details Modal -->
    <div class="modal fade" id="itemDetailsModal" tabindex="-1" aria-labelledby="itemDetailsModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="itemDetailsModalLabel">Item Details</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div class="row">
                        <div class="col-md-6">
                            <img id="itemDetailsImage" src="" alt="Item Image" class="img-fluid mb-3">
                        </div>
                        <div class="col-md-6">
                            <h3 id="itemDetailsName"></h3>
                            <p id="itemDetailsTags"></p>
                            <p id="itemDetailsQuantity"></p>
                            <p id="itemDetailsDescription"></p>
                            <a id="itemDetailsLink" href="" target="_blank" rel="noopener noreferrer">External Link</a>
                            <div id="itemDetailsWarnings" class="mt-3"></div>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                </div>
            </div>
        </div>
    </div>
    <div class="modal fade" id="chatModal" tabindex="-1" aria-labelledby="chatModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="chatModalLabel">Ask the iLab</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div id="chatMessages"> 
                        <div id="loadingSpinner" style="display: none;">
                            <i class="fas fa-spinner fa-spin"></i> iLab is thinking...
                        </div>
                    </div>
                    
                    <div class="input-group mt-3">
                        <input type="text" id="userInput" class="form-control" placeholder="Type your message...">
                        <button class="btn btn-primary" id="sendMessage">Send</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="/static/js/script.js"></script>
</body>
</html>
